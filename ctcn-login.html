                    });
                } catch (error) {
                    console.error("Firebase 初始化失敗，將自動降級至 Demo 模擬模式：", error);
                    showToast("Firebase 初始化出錯，切換至 Demo 模式", "error");
                    enableDemoMode();
                }
            }
        });

        // 啟用 Demo 模擬模式
        function enableDemoMode() {
            isDemoMode = true;
            const badge = document.getElementById('mode-badge');
            const badgeText = document.getElementById('mode-text');
            badge.className = "fixed top-4 left-1/2 -translate-x-1/2 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider shadow-lg backdrop-blur-md flex items-center gap-2 bg-yellow-500/10 text-yellow-500 border border-yellow-500/20";
            badgeText.textContent = "Demo 模擬模式 (非真實 Firebase)";
            showToast("已切換至 Demo 模擬模式！", "info");

            // Demo 模式預設狀態：無用戶登入
            initializeDemoMock();
        }

        // 啟用真實 Firebase 運作模式
        function enableRealMode() {
            isDemoMode = false;
            const badge = document.getElementById('mode-badge');
            const badgeText = document.getElementById('mode-text');
            badge.className = "fixed top-4 left-1/2 -translate-x-1/2 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider shadow-lg backdrop-blur-md flex items-center gap-2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
            badgeText.textContent = "已連線至您的 Firebase 服務";
            showToast("成功連線至 Firebase Authentication！", "success");
        }

        // ==========================================
        // 2. Demo 模擬數據庫與邏輯
        // ==========================================
        const demoStorageKey = 'mock_firebase_auth_users';
        let currentDemoUser = null;

        function initializeDemoMock() {
            // 初始化模擬資料庫 (本機 localStorage)
            if (!localStorage.getItem(demoStorageKey)) {
                // 預先建立一個展示帳號
                const defaultUsers = [
                    {
                        email: "demo@example.com",
                        password: "password123",
                        displayName: "展示之星",
                        emailVerified: true,
                        uid: "demo-uid-99999",
                        photoURL: "https://placehold.co/100x100/6366f1/ffffff?text=D",
                        providerId: "password"
                    }
                ];
                localStorage.setItem(demoStorageKey, JSON.stringify(defaultUsers));
            }
            
            // 讀取可能儲存的 Session 狀態
            const sessionUser = sessionStorage.getItem('mock_session_user');
            if (sessionUser) {
                currentDemoUser = JSON.parse(sessionUser);
                handleAuthStateChanged(currentDemoUser);
            } else {
                switchView('login');
            }
        }

        // ==========================================
        // 3. 核心驗證業務邏輯 (支援真實與 Demo 雙模)
        // ==========================================

        // 【電子信箱註冊】
        window.handleEmailRegister = async function(event) {
            event.preventDefault();
            const name = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-confirm').value;

            // 基本前端安全驗證
            if (password.length < 6) {
                showToast("密碼強度不足：長度至少需要 6 個字元！", "warning");
                return;
            }
            if (password !== confirm) {
                showToast("密碼驗證錯誤：兩次輸入的密碼不一致！", "error");
                return;
            }

            setLoading('register', true);

            if (isDemoMode) {
                // 模擬註冊邏輯
                setTimeout(() => {
                    let users = JSON.parse(localStorage.getItem(demoStorageKey) || "[]");
                    if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
                        showToast("此信箱已被其他帳戶註冊使用！", "error");
                        setLoading('register', false);
                        return;
                    }

                    // 建立新模擬用戶
                    const newUser = {
                        email: email,
                        password: password,
                        displayName: name,
                        emailVerified: false, // 電子信箱預設未驗證
                        uid: "mock-uid-" + Math.random().toString(36).substr(2, 9),
                        photoURL: `https://placehold.co/100x100/8b5cf6/ffffff?text=${encodeURIComponent(name.charAt(0).toUpperCase())}`,
                        providerId: "password"
                    };

                    users.push(newUser);
                    localStorage.setItem(demoStorageKey, JSON.stringify(users));
                    
                    // 寫入 Session，將其設為當前未驗證登入狀態
                    currentDemoUser = newUser;
                    sessionStorage.setItem('mock_session_user', JSON.stringify(currentDemoUser));
                    
                    setLoading('register', false);
                    showToast("註冊成功！已寄出驗證信，請查收。", "success");
                    handleAuthStateChanged(currentDemoUser);
                }, 1200);

            } else {
                // 真實 Firebase 註冊
                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    
                    // 更新用戶檔案姓名
                    await updateProfile(user, { displayName: name });
                    
                    // 發送驗證信
                    await sendEmailVerification(user);
                    
                    showToast("註冊成功，認證郵件已發送！", "success");
                    setLoading('register', false);
                    // 註冊後會觸發 onAuthStateChanged
                } catch (error) {
                    console.error(error);
                    setLoading('register', false);
                    handleFirebaseError(error);
                }
            }
        };

        // 【電子信箱登入】
        window.handleEmailLogin = async function(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            setLoading('login', true);

            if (isDemoMode) {
                // 模擬登入
                setTimeout(() => {
                    const users = JSON.parse(localStorage.getItem(demoStorageKey) || "[]");
                    const matchedUser = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);

                    if (!matchedUser) {
                        showToast("電子郵件或密碼錯誤！", "error");
                        setLoading('login', false);
                        return;
                    }

                    currentDemoUser = matchedUser;
                    sessionStorage.setItem('mock_session_user', JSON.stringify(currentDemoUser));
                    
                    setLoading('login', false);
                    showToast("登入成功！歡迎回來", "success");
                    handleAuthStateChanged(currentDemoUser);
                }, 1000);

            } else {
                // 真實 Firebase 登入
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    setLoading('login', false);
                    showToast("登入成功！", "success");
                } catch (error) {
                    console.error(error);
                    setLoading('login', false);
                    handleFirebaseError(error);
                }
            }
        };

        // 【Google 驗證 (支援登入與註冊合併)】
        window.handleGoogleAuth = async function() {
            if (isDemoMode) {
                showToast("正在建立 Google 安全連線環境...", "info");
                setTimeout(() => {
                    // 模擬隨機 Google 用戶
                    const mockGoogleUser = {
                        email: "google.user@gmail.com",
                        displayName: "谷歌特工",
                        emailVerified: true, // 第三方登入信箱預設即為已認證
                        uid: "mock-google-uid-88888",
                        photoURL: "https://placehold.co/100x100/4285f4/ffffff?text=G",
                        providerId: "google.com"
                    };

                    currentDemoUser = mockGoogleUser;
                    sessionStorage.setItem('mock_session_user', JSON.stringify(currentDemoUser));
                    
                    showToast("Google 帳戶登入成功！", "success");
                    handleAuthStateChanged(mockGoogleUser);
                }, 1200);

            } else {
                // 真實 Firebase Google 登入
                const provider = new GoogleAuthProvider();
                try {
                    await signInWithPopup(auth, provider);
                    showToast("Google 驗證成功！", "success");
                } catch (error) {
                    console.error(error);
                    handleFirebaseError(error);
                }
            }
        };

        // 【忘記密碼發送連結】
        window.handleForgotPassword = async function(event) {
            event.preventDefault();
            const email = document.getElementById('forgot-email').value.trim();

            setLoading('forgot', true);

            if (isDemoMode) {
                setTimeout(() => {
                    setLoading('forgot', false);
                    showToast(`重設密碼連結已發送至：${email}！請檢查您的收件匣。`, "success");
                    switchView('login');
                }, 1200);
            } else {
                try {
                    await sendPasswordResetEmail(auth, email);
                    setLoading('forgot', false);
                    showToast("重設密碼郵件發送成功，請前往信箱確認！", "success");
                    switchView('login');
                } catch (error) {
                    console.error(error);
                    setLoading('forgot', false);
                    handleFirebaseError(error);
                }
            }
        };

        // 【重新發送郵件驗證連結】
        window.resendVerificationEmail = async function() {
            if (isDemoMode) {
                showToast("已成功重發模擬驗證信！請點擊上方按鈕模擬完成認證。", "info");
            } else {
                try {
                    if (auth.currentUser) {
                        await sendEmailVerification(auth.currentUser);
                        showToast("驗證信件已重新寄出，請檢查您的信箱！", "success");
                    } else {
                        showToast("無效的用戶工作階段，請重新登入！", "error");
                    }
                } catch (error) {
                    console.error(error);
                    handleFirebaseError(error);
                }
            }
        };

        // 【檢查驗證狀態並更新】
        window.checkEmailVerificationStatus = async function() {
            if (isDemoMode) {
                // 模擬驗證：點擊此按鈕直接在資料庫與當前 Session 將該帳號改為已驗證
                if (currentDemoUser) {
                    currentDemoUser.emailVerified = true;
                    sessionStorage.setItem('mock_session_user', JSON.stringify(currentDemoUser));
                    
                    // 同步寫入模擬庫
                    let users = JSON.parse(localStorage.getItem(demoStorageKey) || "[]");
                    users = users.map(u => u.email.toLowerCase() === currentDemoUser.email.toLowerCase() ? { ...u, emailVerified: true } : u);
                    localStorage.setItem(demoStorageKey, JSON.stringify(users));

                    showToast("帳戶驗證完成！已為您成功登入。", "success");
                    handleAuthStateChanged(currentDemoUser);
                }
            } else {
                try {
                    if (auth.currentUser) {
                        // 【關鍵細節】Firebase 會快取狀態，必須強制 reload 才能取得最新信箱驗證情形
                        await auth.currentUser.reload();
                        const refreshedUser = auth.currentUser;
                        
                        if (refreshedUser.emailVerified) {
                            showToast("認證成功，正在進入系統...", "success");
                            handleAuthStateChanged(refreshedUser);
                        } else {
                            showToast("驗證尚未完成，請先至您的信箱點選啟用連結！", "warning");
                        }
                    } else {
                        showToast("用戶狀態遺失，請返回登入頁面重新操作。", "error");
                        switchView('login');
                    }
                } catch (error) {
                    console.error(error);
                    handleFirebaseError(error);
                }
            }
        };

        // 【安全登出】
        window.handleLogout = async function(isSilent = false) {
            if (isDemoMode) {
                currentDemoUser = null;
                sessionStorage.removeItem('mock_session_user');
                if (!isSilent) showToast("您已安全登出系統。", "info");
                handleAuthStateChanged(null);
            } else {
                try {
                    await signOut(auth);
                    if (!isSilent) showToast("您已安全登出系統。", "info");
                    // 登出會自動觸發 onAuthStateChanged
                } catch (error) {
                    console.error(error);
                    showToast("登出程序發生未知異常！", "error");
                }
            }
        };

        // ==========================================
        // 4. 路由與畫面切換管理 (View & Screen Manager)
        // ==========================================
        window.switchView = function(targetView) {
            // 清空所有表單輸入值
            if (targetView === 'login') {
                document.getElementById('form-login').reset();
            } else if (targetView === 'register') {
                document.getElementById('form-register').reset();
            } else if (targetView === 'forgot') {
                document.getElementById('form-forgot').reset();
            }

            const views = ['login', 'register', 'forgot', 'verify-pending', 'dashboard'];
            views.forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if (v === targetView) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            });

            // 根據目標畫面動態微調主卡片標題
            const pTitle = document.getElementById('portal-title');
            const pSubtitle = document.getElementById('portal-subtitle');

            switch (targetView) {
                case 'login':
                    pTitle.textContent = "登入您的帳戶";
                    pSubtitle.textContent = "請輸入您的電子信箱與密碼";
                    break;
                case 'register':
                    pTitle.textContent = "建立您的新帳戶";
                    pSubtitle.textContent = "註冊並獲取您的完整操作權限";
                    break;
                case 'forgot':
                    pTitle.textContent = "重設您的安全密碼";
                    pSubtitle.textContent = "發送系統安全驗證重設鏈結";
                    break;
                case 'verify-pending':
                    pTitle.textContent = "安全驗證確認中";
                    pSubtitle.textContent = "啟用您的帳戶以確保帳號安全";
                    break;
                case 'dashboard':
                    pTitle.textContent = "主控台中心";
                    pSubtitle.textContent = "管理您目前的個人檔案與帳戶設定";
                    break;
            }
        };

        // 登入狀態監聽路由分流 (關鍵路由)
        function handleAuthStateChanged(user) {
            if (user) {
                // 如果用戶使用的是「電子信箱與密碼」註冊，但尚未進行電子郵件驗證，則強制導向驗證等待畫面
                if (user.providerId === "password" || (user.providerData && user.providerData[0] && user.providerData[0].providerId === "password")) {
                    if (!user.emailVerified) {
                        document.getElementById('verify-email-display').textContent = user.email;
                        switchView('verify-pending');
                        return;
                    }
                }

                // 其餘情況 (Google 登入或信箱已驗證) 直接進入 Dashboard
                updateDashboardUI(user);
                switchView('dashboard');
            } else {
                // 未登入，回到登入畫面
                switchView('login');
            }
        }

        // 更新 Dashboard 個人資料界面
        function updateDashboardUI(user) {
            const avatar = document.getElementById('user-avatar');
            const nameEl = document.getElementById('user-display-name');
            const emailEl = document.getElementById('user-email-text');
            const verifiedBadge = document.getElementById('user-verified-badge');
            const providerBadge = document.getElementById('user-provider-badge');
            const uidEl = document.getElementById('user-uid-text');

            // 照片
            if (user.photoURL) {
                avatar.src = user.photoURL;
                avatar.onerror = function() {
                    avatar.src = `https://placehold.co/100x100/6366f1/ffffff?text=${encodeURIComponent((user.displayName || user.email || 'U').charAt(0).toUpperCase())}`;
                };
            } else {
                avatar.src = `https://placehold.co/100x100/6366f1/ffffff?text=${encodeURIComponent((user.displayName || user.email || 'U').charAt(0).toUpperCase())}`;
            }

            // 名字
            nameEl.textContent = user.displayName || "系統新用戶";
            
            // 信箱
            emailEl.textContent = user.email || "無提供電子郵件資訊";
            
            // 是否驗證
            if (user.emailVerified) {
                verifiedBadge.className = "px-1.5 py-0.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-semibold rounded-md";
                verifiedBadge.textContent = "已驗證";
            } else {
                verifiedBadge.className = "px-1.5 py-0.5 bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 text-[10px] font-semibold rounded-md";
                verifiedBadge.textContent = "未驗證";
            }

            // 登入型態與 UID
            const provId = user.providerId || (user.providerData && user.providerData[0] ? user.providerData[0].providerId : 'password');
            providerBadge.textContent = provId === 'google.com' ? 'Google 帳戶登入' : '電子信箱與密碼';
            uidEl.textContent = user.uid;
        }

        // ==========================================
        // 5. 使用者體驗與實用小工具 (UX/UI Utilities)
        // ==========================================

        // 控制按鈕的 Loading 載入動畫
        function setLoading(formType, isLoading) {
            const btnText = document.getElementById(`btn-${formType}-text`);
            const btnSpinner = document.getElementById(`btn-${formType}-spinner`);
            const buttons = document.querySelectorAll('button, input');

            if (isLoading) {
                btnSpinner.classList.remove('hidden');
                if (btnText) btnText.style.opacity = '0.6';
                // 載入時鎖定所有輸入防點擊
                buttons.forEach(b => b.disabled = true);
            } else {
                btnSpinner.classList.add('hidden');
                if (btnText) btnText.style.opacity = '1';
                buttons.forEach(b => b.disabled = false);
            }
        }

        // 密碼顯示/隱藏切換
        window.togglePasswordVisibility = function(inputId) {
            const input = document.getElementById(inputId);
            const eyeIcon = document.getElementById(`${inputId}-eye`);
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.className = "fa-regular fa-eye-slash";
            } else {
                input.type = 'password';
                eyeIcon.className = "fa-regular fa-eye";
            }
        };

        // Toast 彈出式客製化訊息通知
        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            
            const toast = document.createElement('div');
            toast.className = "fade-in flex items-center gap-3 p-4 rounded-xl shadow-xl border backdrop-blur-md transition-all duration-300";
            
            let icon = '';
            let classes = '';
            
            switch (type) {
                case 'success':
                    icon = '<i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>';
                    classes = 'bg-emerald-950/85 border-emerald-500/30 text-emerald-200';
                    break;
                case 'error':
                    icon = '<i class="fa-solid fa-triangle-exclamation text-rose-400 text-lg"></i>';
                    classes = 'bg-rose-950/85 border-rose-500/30 text-rose-200';
                    break;
                case 'warning':
                    icon = '<i class="fa-solid fa-circle-exclamation text-yellow-400 text-lg"></i>';
                    classes = 'bg-yellow-950/85 border-yellow-500/30 text-yellow-200';
                    break;
                default:
                    icon = '<i class="fa-solid fa-circle-info text-blue-400 text-lg"></i>';
                    classes = 'bg-slate-900/90 border-indigo-500/30 text-indigo-200';
            }
            
            toast.className += ` ${classes}`;
            toast.innerHTML = `
                ${icon}
                <div class="text-xs font-medium flex-1">${message}</div>
                <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            `;
            
            container.appendChild(toast);
            
            // 4.5秒後自動關閉通知
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        };

        // Firebase 專業中文錯誤字典對照表
        function handleFirebaseError(error) {
            let errorMsg = "系統發生未知錯誤，請稍後再試。";
            switch (error.code) {
                case 'auth/invalid-email':
                    errorMsg = "輸入的電子郵件格式不正確！";
                    break;
                case 'auth/user-disabled':
                    errorMsg = "該帳戶已被系統停用，請聯絡客服。";
                    break;
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    errorMsg = "登入憑證不正確：信箱或密碼輸入錯誤！";
                    break;
                case 'auth/email-already-in-use':
                    errorMsg = "此電子郵件已被註冊，請直接登入！";
                    break;
                case 'auth/weak-password':
                    errorMsg = "密碼安全度不足，至少需填寫 6 位字元！";
                    break;
                case 'auth/operation-not-allowed':
                    errorMsg = "系統尚未開啟此項登入/註冊機制，請檢查後台設定。";
                    break;
                case 'auth/popup-closed-by-user':
                    errorMsg = "驗證視窗已關閉：您未完成 Google 登入驗證。";
                    break;
                default:
                    errorMsg = error.message || errorMsg;
            }
            showToast(errorMsg, "error");
        }
    </script>
